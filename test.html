<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9f1d24">
    <meta name="description" content="材料学院党建知识综合测试">
    <title>综合测试 · 党建学习平台</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="test" class="auth-pending">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="党建学习平台首页">
          <img src="assets/seu-smse-lockup.png" alt="东南大学材料科学与工程学院">
          <span class="brand-divider" aria-hidden="true"></span><span class="brand-title">党建学习平台</span>
        </a>
        <a class="header-note home-link" href="index.html">返回首页</a>
      </div>
    </header>
    <nav class="main-nav" aria-label="主导航">
      <div class="nav-inner"><a href="index.html">首页</a><a href="practice.html">专题练习</a><a href="test.html" aria-current="page">综合测试</a></div>
    </nav>
    <main id="main" class="site-main page-main test-launch-page">
      <div class="page-heading">
        <h1>综合测试</h1>
        <p>检验党章、党务程序、党史、党的创新理论与时事政治学习情况。</p>
      </div>
      <section class="test-briefing" aria-labelledby="briefing-title">
        <header class="briefing-heading">
          <h2 id="briefing-title">考试说明</h2>
          <span>综合卷</span>
        </header>
        <dl class="briefing-facts">
          <div><dt>考试时长</dt><dd>60 分钟</dd></div>
          <div><dt>试题数量</dt><dd>55 题</dd></div>
          <div><dt>试卷满分</dt><dd>100 分</dd></div>
          <div><dt>组卷方式</dt><dd>系统随机抽题</dd></div>
        </dl>
        <div class="briefing-rules" role="group" aria-label="题型及计分规则">
          <p>单选题 <strong>25 题，每题 2 分</strong></p>
          <p>多选题 <strong>10 题，每题 3 分</strong>，少选得 1 分，错选不得分</p>
          <p>判断题 <strong>20 题，每题 1 分</strong></p>
          <p>时事政治题 <strong>整卷最高 20 分</strong>，不足时由其他专题题目补足</p>
        </div>
        <div class="briefing-actions">
          <button class="button button-red" type="button" id="start-test">开始综合测试 <span aria-hidden="true">→</span></button>
          <p class="test-availability" id="test-availability" role="status" hidden></p>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span>东南大学材料科学与工程学院</span></div></footer>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
