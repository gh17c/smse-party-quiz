<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9f1d24">
    <meta name="description" content="材料学院党建学习平台账号登录">
    <title>账号登录 · 党建学习平台</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="党建学习平台首页">
          <img src="assets/seu-smse-lockup.png" alt="东南大学材料科学与工程学院">
          <span class="brand-divider" aria-hidden="true"></span><span class="brand-title">党建学习平台</span>
        </a>
      </div>
    </header>
    <main id="main" class="login-main">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-tabs" role="group" aria-label="账号操作">
          <button type="button" data-auth-mode="login" aria-pressed="true">登录</button>
          <button type="button" data-auth-mode="register" aria-pressed="false">注册</button>
        </div>
        <h1 id="login-title">账号登录</h1>
        <p class="login-intro">使用学号和密码进入学习平台。</p>
        <form id="login-form" novalidate>
          <div class="login-field">
            <label for="login-student-id">学号</label>
            <input id="login-student-id" name="student-id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required>
          </div>
          <div class="login-field" id="register-name-field" hidden>
            <label for="register-name">姓名</label>
            <input id="register-name" name="full-name" type="text" autocomplete="name" maxlength="40" disabled>
          </div>
          <div class="login-field">
            <label for="login-password">密码</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="register-password-hint" required>
            <span id="register-password-hint" class="login-hint" hidden>至少 6 位，请设置自己的密码。</span>
          </div>
          <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
          <button class="button button-red login-submit" id="login-submit" type="submit">登录</button>
        </form>
      </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span>东南大学材料科学与工程学院</span></div></footer>
    <script type="module" src="src/login.js"></script>
  </body>
</html>
