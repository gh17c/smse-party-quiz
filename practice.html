  <body data-page="practice" class="auth-pending">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="党建学习平台首页">
          <img src="assets/seu-smse-lockup.png" alt="东南大学材料科学与工程学院">
          <span class="brand-divider" aria-hidden="true"></span><span class="brand-title">党建学习平台</span>
        </a>
        <a class="header-note home-link" href="index.html">返回首页</a>
      </div>
    </header>
    <nav class="main-nav" aria-label="主导航">
      <div class="nav-inner"><a href="index.html">首页</a><a href="practice.html" aria-current="page">专题练习</a><a href="test.html">综合测试</a></div>
    </nav>
    <main id="main" class="site-main page-main">
      <div class="page-heading practice-page-heading">
        <h1>专题练习</h1>
        <p>选择学习专题，逐题作答并查看知识解析。</p>
      </div>
      <section class="practice-layout" aria-label="专题与答题">
        <aside class="practice-topics" aria-labelledby="practice-topics-title">
          <h2 id="practice-topics-title">学习专题</h2>
          <div class="topic-list">
            <a class="topic-row" href="practice.html?topic=%E5%85%9A%E7%AB%A0%E5%9F%BA%E7%A1%80" data-topic="党章基础"><span class="topic-body"><strong>党章基础</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E5%85%9A%E5%91%98%E4%B9%89%E5%8A%A1%E4%B8%8E%E7%BA%AA%E5%BE%8B" data-topic="党员义务与纪律"><span class="topic-body"><strong>党员义务与纪律</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E5%8F%91%E5%B1%95%E5%85%9A%E5%91%98%E7%A8%8B%E5%BA%8F" data-topic="发展党员程序"><span class="topic-body"><strong>发展党员程序</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E6%97%B6%E4%BA%8B%E6%94%BF%E6%B2%BB%E4%B8%8E%E9%AB%98%E8%B4%A8%E9%87%8F%E5%8F%91%E5%B1%95" data-topic="时事政治与高质量发展"><span class="topic-body"><strong>时事政治与高质量发展</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E5%85%9A%E5%8F%B2%E4%B8%8E%E7%BA%A2%E8%89%B2%E7%9F%A5%E8%AF%86" data-topic="党史与红色知识"><span class="topic-body"><strong>党史与红色知识</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E4%B9%A0%E8%BF%91%E5%B9%B3%E5%85%B3%E4%BA%8E%E5%85%9A%E7%9A%84%E5%BB%BA%E8%AE%BE%E7%9A%84%E9%87%8D%E8%A6%81%E6%80%9D%E6%83%B3" data-topic="习近平关于党的建设的重要思想"><span class="topic-body"><strong>习近平关于党的建设的重要思想</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
            <a class="topic-row" href="practice.html?topic=%E5%85%9A%E7%9A%84%E4%BA%8C%E5%8D%81%E5%A4%A7%E7%B2%BE%E7%A5%9E" data-topic="党的二十大精神"><span class="topic-body"><strong>党的二十大精神</strong><small>题量读取中</small></span><span class="topic-arrow" aria-hidden="true">→</span></a>
          </div>
        </aside>
        <section class="practice-workspace" id="practice" aria-labelledby="practice-title">
          <div class="section-heading">
            <h2 id="practice-title">开始练习</h2>
            <p id="practice-save-status" class="practice-save-state" role="status" hidden><span id="practice-save-label"></span></p>
          </div>
          <div class="practice-overview" id="practice-overview" hidden>
            <div class="practice-progress-heading"><span id="practice-progress-caption">练习进度</span><button class="text-button" id="practice-next-unanswered" type="button">继续未答</button></div>
            <div class="practice-progress-track" id="practice-progress-track" role="progressbar" aria-label="本专题已提交题目" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span id="practice-progress-fill"></span></div>
            <details class="practice-question-map" id="practice-question-map">
              <summary><span>答题卡</span><span class="practice-map-summary-end"><span id="practice-map-location"></span><svg class="practice-map-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></summary>
              <div class="practice-map-panel">
                <div class="practice-map-legend"><span class="map-key-correct">答对</span><span class="map-key-incorrect">答错</span><span class="map-key-draft">待提交</span><span class="map-key-unanswered">未答</span></div>
                <nav class="practice-map-grid" id="practice-map-grid" aria-label="按题号跳转"></nav>
                <div class="practice-map-pagination"><button class="practice-map-page" id="practice-map-prev" type="button" aria-label="上一组题号">上一组</button><span id="practice-map-range" aria-live="polite"></span><button class="practice-map-page" id="practice-map-next" type="button" aria-label="下一组题号">下一组</button></div>
              </div>
            </details>
          </div>
          <div class="practice-mount" id="practice-content" aria-live="polite">
            <div class="practice-welcome">
              <h3>选择专题，开始练习</h3>
              <p>每题提交后可查看解析，练习进度自动保存。</p>
              <ol class="practice-start-steps"><li>选择专题</li><li>逐题作答</li><li>回看解析</li></ol>
              <button class="button button-red" id="practice-first-topic" type="button">从党章基础开始</button>
            </div>
          </div>
        </section>
      </section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><span>东南大学材料科学与工程学院</span></div></footer>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
